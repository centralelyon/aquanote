name: Run Tests

on:
  push:
    branches: [ dev , main ] # mettez les branches que vous souhaitez surveiller
  pull_request:
    branches: [ dev , main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Fix ESLint permissions
        run: chmod +x ./node_modules/.bin/eslint

      - name: Lint code
        run: npx eslint --config workflow/linter/eslint.config.mjs .

      - name: Run Vitest unit tests
        run: npx vitest --config workflow/test/vitest.config.js

      - name: Run Vitest with coverage
        run: npx vitest --config workflow/test/vitest.config.js --coverage

      - name: Run Playwright E2E tests
        run: npx playwright test --config workflow/test/playwright.config.js

      
